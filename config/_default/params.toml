# ==============================================================================
#  PaperMod 主题配置  ——  dev/config/_default/params.toml
#
#  这是你日常唯一需要改的主题文件。
#  改完保存，在 dev 目录运行 `hugo server` 即时生效（或重新 hugo 构建）。
#
#  ⚠ 两条规则，踩了会「改了没反应」：
#    1. 这里不要再写 [params] 包裹，直接写键名。
#    2. 所有不带前缀的普通开关必须写在第一个 [表名] 之前。
#       TOML 里一旦出现 [foo] 或 [[foo.bar]]，后面的裸键都会并进那张表，
#       主题读不到，表现就是开关失灵。
# ==============================================================================


# ------------------------------------------------------------------------------
#  一、基本信息
# ------------------------------------------------------------------------------

# 站点标题：只用于 SEO（og:site_name）。页头显示的站名来自 hugo.toml 的 title
title = "Sachie's blog"

# SEO 描述，出现在首页 meta description 和分享卡片上
description = '承福而思'

# 作者名，显示在文章标题下方
author = 'Sachie'

# 首页 meta keywords
keywords = ['博客', 'Hugo', 'PaperMod']

# 文章日期格式（Go 的时间格式，不是 YYYY-MM-DD）
# '2006-01-02' → 2026-11-24
# '2006年01月02日' → 2026年11月24日
# 'Jan 2, 2006' → Nov 24, 2026
DateFormat = '2006-01-02'

# 'production' 时，即使是本地 hugo server 也输出 SEO / OpenGraph / schema 标签
env = 'production'


# ------------------------------------------------------------------------------
#  二、文章页显示哪些信息
# ------------------------------------------------------------------------------

# 阅读时间（例如「3 分钟」）
ShowReadingTime = false

# 字数统计（例如「120 字」）
ShowWordCount = true

# 文章底部转发按钮（X / Facebook / 微博等）
ShowShareButtons = false

# 上一篇 / 下一篇
ShowPostNavLinks = true

# 标题上方的层级导航（首页 » 文章）
ShowBreadCrumbs = true

# 代码块右上角「复制」按钮
ShowCodeCopyButtons = true

# 分类 / 标签列表页是否显示 RSS 图标
ShowRssButtonInSectionTermList = false


# ------------------------------------------------------------------------------
#  三、文章目录（TOC）
# ------------------------------------------------------------------------------

# 是否显示右侧目录（文章里有 2~3 级标题才出现）
ShowToc = true

# 目录默认是否展开
TocOpen = false

# 用 Hugo 内置 TOC（推荐 true）
UseHugoToc = true


# ------------------------------------------------------------------------------
#  四、列表 / 归档 / 分页
# ------------------------------------------------------------------------------

# 哪些内容区块（content/ 下的子目录）算「文章」，首页与归档都按它筛选
mainSections = ['posts']

# 归档页是否包含非文章页面（关于、搜索等）
ShowAllPagesInArchive = false

# 分页按钮上是否显示「第 2/5 页」
ShowPageNums = false

# 首页第一篇是否用大卡片样式（true = 全部统一小卡片）
disableSpecial1stPost = false


# ------------------------------------------------------------------------------
#  五、外观
# ------------------------------------------------------------------------------

# 默认配色：'auto'（跟随系统）/ 'light' / 'dark'
defaultTheme = 'auto'

# 是否隐藏右上角的明暗切换按钮（配合上面固定配色）
disableThemeToggle = false

# 隐藏右下角「回到顶部」按钮
disableScrollToTop = false

# 关闭标题的锚点链接（# 号）
disableAnchoredHeadings = false


# ==============================================================================
#  以下是嵌套表（[xxx]），这里的键不会影响上面的普通开关
# ==============================================================================

# ------------------------------------------------------------------------------
#  六、首页首屏（二选一）
#    A. 信息卡  → 打开 [homeInfoParams]，并把 profileMode.enabled 设为 false
#    B. 个人主页 → 当前用的这个
# ------------------------------------------------------------------------------

# ---- A. 信息卡（当前关闭；想换回来就取消注释，并把 profileMode.enabled 改成 false） ----
# [homeInfoParams]
#   Title = '你好，我是 Sachie 👋'
#   Content = '''
# 这里是我的博客，用来记录技术笔记和生活随想。
# 用上方的「搜索」找文章，或直接往下浏览最新文章。
# '''
#   AlignSocialIconsTo = 'center'

# ---- B. 个人主页模式（当前启用，首页模板会在这块下面直接列出文章） ----
[profileMode]
  enabled = true
  title = "Sachie's blog"
  subtitle = '承福而思'
  # 头像：图片放 dev/assets/images/ 下，这里写相对 assets 的路径
  imageUrl = 'images/precure.jpg'
  imageTitle = 'Sachie 的头像'
  imageWidth = 150
  imageHeight = 150
  # 按钮不再配置：导航栏已经有「文章 / 搜索 / 关于」，这里放会重复
  # buttons = []


# 页脚
[footer]
  # 隐藏默认的「© 年份 站名」那一行，改用下面的自定义文字
  hideCopyright = true
  # 自定义页脚文字，支持 HTML
  text = '© 2026 Sachie · 承福而思'


# 每篇文章底部的「编辑此页」链接（指向你的 Git 仓库时很有用）
[editPost]
  URL = ''
  appendFilePath = true
  Text = '编辑此页'


# 封面图默认行为（文章 front matter 里可单独覆盖）
[cover]
  hidden = false
  hiddenInList = false
  hiddenInSingle = false
  linkFullImages = true
  responsiveImages = true


# 站内搜索的 Fuse.js 参数（改大 threshold 更模糊，改小更严格）
[fuseOpts]
  isCaseSensitive = false
  minMatchCharLength = 2
  findAllMatches = false
  location = 0
  threshold = 0.3
  distance = 100
  ignoreLocation = false
  useExtendedSearch = false


# 结构化数据（SEO）
[schema]
  # 'Organization' 或 'Person'
  publisherType = 'Person'
  sameAs = []


# 静态资源：favicon 等。文件放在 dev/static/ 下（已附带一套默认图标）
[assets]
  favicon = 'favicon.ico'
  favicon16x16 = 'favicon-16x16.png'
  favicon32x32 = 'favicon-32x32.png'
  apple_touch_icon = 'apple-touch-icon.png'
  safari_pinned_tab = 'safari-pinned-tab.svg'
  theme_color = '#2e2e33'
  msapplication_TileColor = '#2e2e33'
  disableFingerprinting = false


# ------------------------------------------------------------------------------
#  七、社交图标（可选）：常用 name → github / gitlab / x / linkedin /
#      instagram / facebook / youtube / email / stackoverflow / reddit / telegram
